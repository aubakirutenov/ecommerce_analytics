version: 2

models:
  - name: stg_orders
    description: One row per order. Raw timestamps renamed with the _at suffix.
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: stg_customers
    description: One row per customer_id. A real person can have several customer_ids; customer_unique_id identifies the person.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    description: One row per product, with the Portuguese category name.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_translation')
                field: product_category_name
              config:
                severity: warn

  - name: stg_product_category_translation
    description: Portuguese to English category names.
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null

  - name: stg_order_items
    description: One row per item in an order. Grain is order_id plus order_item_id.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: stg_order_reviews
    description: One row per review. review_id is not unique in the source, so it has no unique test.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false