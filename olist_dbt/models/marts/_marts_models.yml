version: 2

models:
  - name: dim_customer
    description: One row per customer_id.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_seller
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: One row per product, with the English category name ('unknown' when missing).
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        data_tests:
          - not_null

  - name: dim_date
    description: One row per calendar day, Sep 2016 to Oct 2018.
    columns:
      - name: date
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    description: One row per order, with delivery status (is_late) and the average review score.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: is_late
        description: 1 = delivered after the estimate, 0 = on time, NULL = not delivered or no delivery date.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: fact_order_items
    description: One row per item in an order (order_id + order_item_id).
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date